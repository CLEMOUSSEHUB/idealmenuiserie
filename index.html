<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GPS Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #181c27;
      --surface2: #1f2435;
      --accent: #00e5a0;
      --accent2: #005f42;
      --danger: #ff4d6d;
      --text: #e8eaf6;
      --muted: #6b7280;
      --border: rgba(255,255,255,0.07);
      --radius: 12px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    /* HEADER */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
      flex-shrink: 0;
    }

    #header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent);
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
      flex-shrink: 0;
    }
    #status-dot.active { background: var(--accent); animation: pulse 1.5s infinite; }
    #status-dot.error { background: var(--danger); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    /* MAP */
    #map {
      flex: 1;
      z-index: 1;
    }

    /* Leaflet dark override */
    .leaflet-tile { filter: brightness(0.85) saturate(0.6) hue-rotate(200deg); }
    .leaflet-control-attribution { display: none; }
    .leaflet-control-zoom a {
      background: var(--surface) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }

    /* BOTTOM PANEL */
    #panel {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 16px;
      flex-shrink: 0;
      z-index: 1000;
    }

    #stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      background: var(--surface2);
      border-radius: 8px;
      padding: 10px 8px;
      text-align: center;
      border: 1px solid var(--border);
    }
    .stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }
    .stat-value.accent { color: var(--accent); }

    #buttons {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      border-radius: var(--radius);
      border: none;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: transform 0.1s, opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(0.97); }

    #btn-start {
      background: var(--accent);
      color: #0f1117;
    }
    #btn-start:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    #btn-stop {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    #btn-stop:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

    #btn-clear {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      flex: 0 0 auto;
      padding: 12px 16px;
    }

    /* STATUS MESSAGE */
    #msg {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      padding: 6px 0 0;
      min-height: 20px;
    }
    #msg.error { color: var(--danger); }
    #msg.ok { color: var(--accent); }

    /* Custom marker */
    .current-marker {
      width: 16px;
      height: 16px;
      background: var(--accent, #00e5a0);
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 0 0 4px rgba(0,229,160,0.3);
    }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="status-dot"></div>
      <h1>GPS TRACKER</h1>
    </div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);" id="time-display">--:--:--</div>
  </div>

  <div id="map"></div>

  <div id="panel">
    <div id="stats">
      <div class="stat">
        <div class="stat-label">Points</div>
        <div class="stat-value accent" id="stat-points">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Distance</div>
        <div class="stat-value" id="stat-dist">0 m</div>
      </div>
      <div class="stat">
        <div class="stat-label">Précision</div>
        <div class="stat-value" id="stat-acc">--</div>
      </div>
    </div>

    <div id="buttons">
      <button id="btn-start" onclick="startTracking()">▶ Démarrer</button>
      <button id="btn-stop" onclick="stopTracking()" disabled>■ Arrêter</button>
      <button id="btn-clear" onclick="clearTrack()" title="Effacer">✕</button>
    </div>
    <div id="msg">Appuie sur Démarrer pour commencer</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // --- MAP SETUP ---
  const map = L.map('map', {
    center: [48.8566, 2.3522],
    zoom: 13,
    zoomControl: true,
    attributionControl: false
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  // Track polyline
  const trackLine = L.polyline([], {
    color: '#00e5a0',
    weight: 3,
    opacity: 0.9,
    lineJoin: 'round',
    lineCap: 'round'
  }).addTo(map);

  // Current position marker
  const markerIcon = L.divIcon({ className: 'current-marker', iconSize: [16, 16], iconAnchor: [8, 8] });
  let currentMarker = null;

  // --- STATE ---
  let tracking = false;
  let watchId = null;
  let points = [];
  let totalDist = 0;

  // Load from localStorage
  const saved = localStorage.getItem('gps_track');
  if (saved) {
    try {
      const data = JSON.parse(saved);
      points = data.points || [];
      totalDist = data.dist || 0;
      if (points.length > 0) {
        const latlngs = points.map(p => [p.lat, p.lng]);
        trackLine.setLatLngs(latlngs);
        updateStats();
        map.fitBounds(trackLine.getBounds(), { padding: [30, 30] });
        showMarker(points[points.length - 1]);
        setMsg('Tracé précédent chargé.', 'ok');
      }
    } catch(e) {}
  }

  // --- CLOCK ---
  function updateClock() {
    const now = new Date();
    document.getElementById('time-display').textContent =
      now.toLocaleTimeString('fr-FR');
  }
  setInterval(updateClock, 1000);
  updateClock();

  // --- TRACKING ---
  function startTracking() {
    if (!navigator.geolocation) {
      setMsg('Géolocalisation non supportée.', 'error');
      return;
    }
    tracking = true;
    document.getElementById('btn-start').disabled = true;
    document.getElementById('btn-stop').disabled = false;
    document.getElementById('status-dot').className = 'active';
    setMsg('Acquisition GPS…', '');

    watchId = navigator.geolocation.watchPosition(
      onPosition,
      onError,
      { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
    );
  }

  function stopTracking() {
    tracking = false;
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    document.getElementById('btn-start').disabled = false;
    document.getElementById('btn-stop').disabled = true;
    document.getElementById('status-dot').className = '';
    setMsg('Tracking arrêté. Tracé sauvegardé.', 'ok');
    saveTrack();
  }

  let lastTime = 0;
  function onPosition(pos) {
    const now = Date.now();
    if (now - lastTime < 2800) return; // ~3 secondes
    lastTime = now;

    const { latitude: lat, longitude: lng, accuracy } = pos.coords;
    const point = { lat, lng, accuracy, t: now };

    // Distance depuis le dernier point
    if (points.length > 0) {
      const prev = points[points.length - 1];
      totalDist += haversine(prev.lat, prev.lng, lat, lng);
    }

    points.push(point);
    trackLine.addLatLng([lat, lng]);
    showMarker(point);
    updateStats();

    // Centre la carte sur la position
    map.setView([lat, lng], Math.max(map.getZoom(), 16));

    const acc = accuracy ? Math.round(accuracy) + 'm' : '--';
    document.getElementById('stat-acc').textContent = acc;
    setMsg(`Position mise à jour · précision ${acc}`, 'ok');
    saveTrack();
  }

  function onError(err) {
    const msgs = {
      1: 'Permission GPS refusée.',
      2: 'Position GPS indisponible.',
      3: 'Délai GPS dépassé.'
    };
    setMsg(msgs[err.code] || 'Erreur GPS.', 'error');
    document.getElementById('status-dot').className = 'error';
  }

  function showMarker(point) {
    if (currentMarker) currentMarker.remove();
    currentMarker = L.marker([point.lat, point.lng], { icon: markerIcon }).addTo(map);
  }

  function clearTrack() {
    if (tracking) stopTracking();
    points = [];
    totalDist = 0;
    trackLine.setLatLngs([]);
    if (currentMarker) { currentMarker.remove(); currentMarker = null; }
    localStorage.removeItem('gps_track');
    updateStats();
    setMsg('Tracé effacé.', '');
  }

  // --- UTILS ---
  function updateStats() {
    document.getElementById('stat-points').textContent = points.length;
    document.getElementById('stat-dist').textContent = formatDist(totalDist);
  }

  function formatDist(m) {
    if (m < 1000) return Math.round(m) + ' m';
    return (m / 1000).toFixed(2) + ' km';
  }

  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
    const Δφ = (lat2 - lat1) * Math.PI / 180;
    const Δλ = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function saveTrack() {
    localStorage.setItem('gps_track', JSON.stringify({ points, dist: totalDist }));
  }

  function setMsg(txt, type) {
    const el = document.getElementById('msg');
    el.textContent = txt;
    el.className = type || '';
  }
</script>
</body>
</html>
