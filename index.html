<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>GPS Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #181c27; --surface2: #1f2435;
      --accent: #00e5a0; --danger: #ff4d6d;
      --text: #e8eaf6; --muted: #6b7280; --border: rgba(255,255,255,0.07);
      --radius: 12px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    /* AUTH SCREEN */
    #auth-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      flex: 1; padding: 24px; gap: 16px;
    }
    #auth-screen h1 { font-size: 22px; font-weight: 700; color: var(--accent); margin-bottom: 8px; letter-spacing: 0.04em; }
    #auth-screen p { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 8px; }
    .auth-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; width: 100%; max-width: 360px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .auth-card h2 { font-size: 16px; font-weight: 700; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; }
    .field input {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; color: var(--text);
      font-family: 'Syne', sans-serif; font-size: 14px; outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus { border-color: var(--accent); }
    .btn-primary {
      background: var(--accent); color: #0f1117; border: none;
      border-radius: 8px; padding: 12px; font-family: 'Syne', sans-serif;
      font-size: 14px; font-weight: 700; cursor: pointer; width: 100%;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .auth-switch { font-size: 13px; color: var(--muted); text-align: center; }
    .auth-switch a { color: var(--accent); cursor: pointer; text-decoration: none; }
    #auth-msg { font-family: 'JetBrains Mono', monospace; font-size: 12px; text-align: center; min-height: 18px; }
    #auth-msg.error { color: var(--danger); }
    #auth-msg.ok { color: var(--accent); }

    /* TRACKER SCREEN */
    #tracker-screen { display: none; flex-direction: column; flex: 1; }

    #header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; background: var(--surface);
      border-bottom: 1px solid var(--border); z-index: 1000; flex-shrink: 0;
    }
    #header h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; color: var(--accent); }
    #user-email { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); }
    #btn-logout {
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); border-radius: 6px; padding: 5px 10px;
      font-size: 11px; font-family: 'Syne', sans-serif; cursor: pointer;
    }

    #status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background 0.3s; flex-shrink: 0; }
    #status-dot.active { background: var(--accent); animation: pulse 1.5s infinite; }
    #status-dot.error { background: var(--danger); }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.3)} }

    #map { flex: 1; z-index: 1; }
    .leaflet-tile { filter: brightness(0.85) saturate(0.6) hue-rotate(200deg); }
    .leaflet-control-attribution { display: none; }
    .leaflet-control-zoom a { background: var(--surface) !important; color: var(--text) !important; border-color: var(--border) !important; }

    #panel { background: var(--surface); border-top: 1px solid var(--border); padding: 14px 16px; flex-shrink: 0; z-index: 1000; }
    #stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .stat { background: var(--surface2); border-radius: 8px; padding: 10px 8px; text-align: center; border: 1px solid var(--border); }
    .stat-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
    .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600; color: var(--text); }
    .stat-value.accent { color: var(--accent); }
    #sync-badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); text-align: right; margin-bottom: 8px; }
    #sync-badge.syncing { color: var(--accent); }

    #buttons { display: flex; gap: 10px; }
    button { flex: 1; padding: 12px; border-radius: var(--radius); border: none; font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: 0.03em; transition: transform 0.1s, opacity 0.2s; -webkit-tap-highlight-color: transparent; }
    button:active { transform: scale(0.97); }
    #btn-start { background: var(--accent); color: #0f1117; }
    #btn-start:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    #btn-stop { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    #btn-stop:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
    #btn-clear { background: transparent; color: var(--muted); border: 1px solid var(--border); flex: 0 0 auto; padding: 12px 16px; }
    #msg { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); text-align: center; padding: 6px 0 0; min-height: 20px; }
    #msg.error { color: var(--danger); }
    #msg.ok { color: var(--accent); }
    .current-marker { width: 16px; height: 16px; background: #00e5a0; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 0 4px rgba(0,229,160,0.3); }
  </style>
</head>
<body>
<div id="app">

  <!-- AUTH SCREEN -->
  <div id="auth-screen">
    <h1>GPS TRACKER</h1>
    <p>Connecte-toi pour enregistrer et synchroniser ton parcours</p>

    <div class="auth-card" id="login-card">
      <h2>Connexion</h2>
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="toi@email.com" />
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="login-pass" placeholder="••••••••" />
      </div>
      <button class="btn-primary" onclick="login()">Se connecter</button>
      <div class="auth-switch">Pas encore de compte ? <a onclick="showRegister()">Créer un compte</a></div>
    </div>

    <div class="auth-card" id="register-card" style="display:none;">
      <h2>Créer un compte</h2>
      <div class="field">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="toi@email.com" />
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="reg-pass" placeholder="8 caractères minimum" />
      </div>
      <button class="btn-primary" onclick="register()">Créer mon compte</button>
      <div class="auth-switch">Déjà un compte ? <a onclick="showLogin()">Se connecter</a></div>
    </div>

    <div id="auth-msg"></div>
  </div>

  <!-- TRACKER SCREEN -->
  <div id="tracker-screen">
    <div id="header">
      <div style="display:flex;align-items:center;gap:8px;">
        <div id="status-dot"></div>
        <div>
          <div id="header-title" style="font-size:15px;font-weight:700;color:var(--accent);letter-spacing:0.04em;">GPS TRACKER</div>
          <div id="user-email" style="font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;"></div>
        </div>
      </div>
      <button id="btn-logout" onclick="logout()">Déconnexion</button>
    </div>

    <div id="map"></div>

    <div id="panel">
      <div id="stats">
        <div class="stat">
          <div class="stat-label">Points</div>
          <div class="stat-value accent" id="stat-points">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Distance</div>
          <div class="stat-value" id="stat-dist">0 m</div>
        </div>
        <div class="stat">
          <div class="stat-label">Précision</div>
          <div class="stat-value" id="stat-acc">--</div>
        </div>
      </div>
      <div id="sync-badge">⬡ non synchronisé</div>
      <div id="buttons">
        <button id="btn-start" onclick="startTracking()">▶ Démarrer</button>
        <button id="btn-stop" onclick="stopTracking()" disabled>■ Arrêter</button>
        <button id="btn-clear" onclick="clearTrack()" title="Effacer">✕</button>
      </div>
      <div id="msg">Appuie sur Démarrer pour commencer</div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ========== CONFIG — REMPLACE CES 2 VALEURS ==========
  const SUPABASE_URL = 'https://luwdixkakwcnluksexxy.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5c0CI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1d2RpeGtha3djbmx1a3NleHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNDgyNTYsImV4cCI6MjA5MjYyNDI1Nn0.LByPT_41zZ4P0SOT0TErIgl0-2i4AiYxLPaUtVJjMFQ';
  // =====================================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // --- AUTH ---
  function showRegister() {
    document.getElementById('login-card').style.display = 'none';
    document.getElementById('register-card').style.display = 'flex';
    setAuthMsg('', '');
  }
  function showLogin() {
    document.getElementById('register-card').style.display = 'none';
    document.getElementById('login-card').style.display = 'flex';
    setAuthMsg('', '');
  }

  async function login() {
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value;
    if (!email || !pass) return setAuthMsg('Remplis tous les champs.', 'error');
    setAuthMsg('Connexion…', '');
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) return setAuthMsg(error.message, 'error');
  }

  async function register() {
    const email = document.getElementById('reg-email').value.trim();
    const pass = document.getElementById('reg-pass').value;
    if (!email || !pass) return setAuthMsg('Remplis tous les champs.', 'error');
    if (pass.length < 8) return setAuthMsg('Mot de passe trop court (8 min).', 'error');
    setAuthMsg('Création du compte…', '');
    const { error } = await sb.auth.signUp({ email, password: pass });
    if (error) return setAuthMsg(error.message, 'error');
    setAuthMsg('Compte créé ! Vérifie tes emails pour confirmer.', 'ok');
  }

  async function logout() {
    stopTracking();
    await sb.auth.signOut();
  }

  function setAuthMsg(txt, type) {
    const el = document.getElementById('auth-msg');
    el.textContent = txt;
    el.className = type || '';
  }

  // Écoute les changements de session
  sb.auth.onAuthStateChange((event, session) => {
    if (session) {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('tracker-screen').style.display = 'flex';
      document.getElementById('user-email').textContent = session.user.email;
      initMap();
      loadPreviousTrack(session.user.id);
    } else {
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('tracker-screen').style.display = 'none';
    }
  });

  // --- MAP ---
  let map, trackLine, currentMarker;
  let mapReady = false;

  function initMap() {
    if (mapReady) return;
    mapReady = true;
    map = L.map('map', { center: [48.8566, 2.3522], zoom: 13, zoomControl: true, attributionControl: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    trackLine = L.polyline([], { color: '#00e5a0', weight: 3, opacity: 0.9, lineJoin: 'round', lineCap: 'round' }).addTo(map);
  }

  async function loadPreviousTrack(userId) {
    const { data, error } = await sb
      .from('gps_points')
      .select('lat, lng, recorded_at')
      .eq('user_id', userId)
      .order('recorded_at', { ascending: true });

    if (error || !data || data.length === 0) return;

    points = data.map(p => ({ lat: p.lat, lng: p.lng }));
    trackLine.setLatLngs(points.map(p => [p.lat, p.lng]));

    // Recalcule la distance
    totalDist = 0;
    for (let i = 1; i < points.length; i++) {
      totalDist += haversine(points[i-1].lat, points[i-1].lng, points[i].lat, points[i].lng);
    }

    updateStats();
    map.fitBounds(trackLine.getBounds(), { padding: [30, 30] });
    showMarker(points[points.length - 1]);
    setSyncBadge('✓ ' + points.length + ' points chargés depuis le cloud', false);
    setMsg('Tracé précédent chargé depuis Supabase.', 'ok');
  }

  // --- TRACKING ---
  let tracking = false;
  let watchId = null;
  let points = [];
  let totalDist = 0;
  let pendingPoints = []; // file d'attente si offline

  function startTracking() {
    if (!navigator.geolocation) return setMsg('Géolocalisation non supportée.', 'error');
    tracking = true;
    document.getElementById('btn-start').disabled = true;
    document.getElementById('btn-stop').disabled = false;
    document.getElementById('status-dot').className = 'active';
    setMsg('Acquisition GPS…', '');

    watchId = navigator.geolocation.watchPosition(onPosition, onError,
      { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
  }

  function stopTracking() {
    tracking = false;
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    document.getElementById('btn-start').disabled = false;
    document.getElementById('btn-stop').disabled = true;
    document.getElementById('status-dot').className = '';
    setMsg('Tracking arrêté.', 'ok');
    flushPending();
  }

  let lastTime = 0;
  async function onPosition(pos) {
    const now = Date.now();
    if (now - lastTime < 2800) return;
    lastTime = now;

    const { latitude: lat, longitude: lng, accuracy } = pos.coords;

    if (points.length > 0) {
      const prev = points[points.length - 1];
      totalDist += haversine(prev.lat, prev.lng, lat, lng);
    }
    points.push({ lat, lng });
    trackLine.addLatLng([lat, lng]);
    showMarker({ lat, lng });
    updateStats();
    map.setView([lat, lng], Math.max(map.getZoom(), 16));

    const acc = accuracy ? Math.round(accuracy) + 'm' : '--';
    document.getElementById('stat-acc').textContent = acc;
    setMsg('Position mise à jour · précision ' + acc, 'ok');

    // Envoi Supabase
    await syncPoint(lat, lng, accuracy);
  }

  async function syncPoint(lat, lng, accuracy) {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return;

    const point = { user_id: user.id, lat, lng, accuracy: accuracy || null };
    const { error } = await sb.from('gps_points').insert(point);

    if (error) {
      pendingPoints.push(point);
      setSyncBadge('⚠ ' + pendingPoints.length + ' point(s) en attente', false);
    } else {
      setSyncBadge('↑ synchronisé · ' + new Date().toLocaleTimeString('fr-FR'), true);
    }
  }

  async function flushPending() {
    if (pendingPoints.length === 0) return;
    const { error } = await sb.from('gps_points').insert(pendingPoints);
    if (!error) {
      setSyncBadge('✓ ' + pendingPoints.length + ' points récupérés', true);
      pendingPoints = [];
    }
  }

  async function clearTrack() {
    if (!confirm('Effacer tout le tracé ? Cette action est irréversible.')) return;
    if (tracking) stopTracking();

    const { data: { user } } = await sb.auth.getUser();
    if (user) {
      await sb.from('gps_points').delete().eq('user_id', user.id);
    }

    points = [];
    totalDist = 0;
    pendingPoints = [];
    trackLine.setLatLngs([]);
    if (currentMarker) { currentMarker.remove(); currentMarker = null; }
    updateStats();
    setSyncBadge('Tracé effacé du cloud', false);
    setMsg('Tracé effacé.', '');
  }

  function onError(err) {
    const msgs = { 1: 'Permission GPS refusée.', 2: 'Position GPS indisponible.', 3: 'Délai GPS dépassé.' };
    setMsg(msgs[err.code] || 'Erreur GPS.', 'error');
    document.getElementById('status-dot').className = 'error';
  }

  function showMarker(point) {
    const icon = L.divIcon({ className: 'current-marker', iconSize: [16, 16], iconAnchor: [8, 8] });
    if (currentMarker) currentMarker.remove();
    currentMarker = L.marker([point.lat, point.lng], { icon }).addTo(map);
  }

  function updateStats() {
    document.getElementById('stat-points').textContent = points.length;
    document.getElementById('stat-dist').textContent = formatDist(totalDist);
  }

  function formatDist(m) {
    return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(2) + ' km';
  }

  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
    const Δφ = (lat2 - lat1) * Math.PI / 180;
    const Δλ = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function setMsg(txt, type) {
    const el = document.getElementById('msg');
    el.textContent = txt;
    el.className = type || '';
  }

  function setSyncBadge(txt, syncing) {
    const el = document.getElementById('sync-badge');
    el.textContent = txt;
    el.className = syncing ? 'syncing' : '';
  }
</script>
</body>
</html>
