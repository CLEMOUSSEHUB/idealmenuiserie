<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPS Tracker — Admin</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #181c27; --surface2: #1f2435;
      --accent: #00e5a0; --danger: #ff4d6d;
      --text: #e8eaf6; --muted: #6b7280; --border: rgba(255,255,255,0.07);
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; overflow: hidden; }
    #app { display: flex; height: 100vh; height: 100dvh; }

    /* AUTH SCREEN */
    #auth-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; gap: 16px; padding: 24px;
    }
    #auth-screen h1 { font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: 0.06em; }
    .auth-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px; width: 100%; max-width: 360px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .auth-card h2 { font-size: 15px; font-weight: 700; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; }
    .field input {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; color: var(--text);
      font-family: 'Syne', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    .field input:focus { border-color: var(--accent); }
    .btn-primary {
      background: var(--accent); color: #0f1117; border: none;
      border-radius: 8px; padding: 12px; font-family: 'Syne', sans-serif;
      font-size: 14px; font-weight: 700; cursor: pointer; width: 100%;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-primary:active { transform: scale(0.97); }
    #auth-msg { font-family: 'JetBrains Mono', monospace; font-size: 12px; text-align: center; min-height: 18px; }
    #auth-msg.error { color: var(--danger); }
    #auth-msg.ok { color: var(--accent); }

    /* ADMIN SCREEN */
    #admin-screen { display: none; flex: 1; position: relative; }

    #sidebar {
      width: 300px; flex-shrink: 0; background: var(--surface);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      overflow: hidden; position: absolute; left: 0; top: 0; bottom: 0; z-index: 1000;
    }
    #sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
    #sidebar-header h1 { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.06em; }
    #admin-email-display { font-size: 10px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 3px; }

    #user-list-wrap { flex: 1; overflow-y: auto; padding: 8px; }
    #user-list-wrap::-webkit-scrollbar { width: 4px; }
    #user-list-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .user-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 8px; margin-bottom: 4px;
      cursor: pointer; transition: background 0.15s;
    }
    .user-item:hover { background: var(--surface2); }
    .user-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .user-info { flex: 1; min-width: 0; }
    .user-email { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 2px; }
    .user-toggle { font-size: 14px; color: var(--muted); flex-shrink: 0; }

    #sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    #btn-fit, #btn-logout-admin {
      border-radius: 8px; padding: 8px 12px; font-family: 'Syne', sans-serif;
      font-size: 12px; cursor: pointer; width: 100%;
    }
    #btn-fit { background: transparent; color: var(--text); border: 1px solid var(--border); }
    #btn-fit:hover { background: var(--surface2); }
    #btn-logout-admin { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    #last-refresh { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); text-align: center; }

    #map { position: absolute; left: 300px; right: 0; top: 0; bottom: 0; }
    .leaflet-tile { filter: brightness(0.85) saturate(0.6) hue-rotate(200deg); }
    .leaflet-control-attribution { display: none; }
    .leaflet-control-zoom a { background: var(--surface) !important; color: var(--text) !important; border-color: var(--border) !important; }
    .leaflet-tooltip {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-family: 'JetBrains Mono', monospace;
      font-size: 11px; border-radius: 6px; padding: 4px 8px;
    }

    @media (max-width: 600px) {
      #sidebar { width: 100%; top: auto; bottom: 0; height: 45vh; border-right: none; border-top: 1px solid var(--border); }
      #map { left: 0; bottom: 45vh; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- AUTH -->
  <div id="auth-screen">
    <h1>GPS TRACKER · ADMIN</h1>
    <div class="auth-card">
      <h2>Connexion administrateur</h2>
      <div class="field">
        <label>Email</label>
        <input type="email" id="admin-login-email" placeholder="admin@exemple.fr" />
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="admin-login-pass" placeholder="••••••••" />
      </div>
      <button class="btn-primary" onclick="adminLogin()">Se connecter</button>
      <div id="auth-msg"></div>
    </div>
  </div>

  <!-- ADMIN -->
  <div id="admin-screen">
    <div id="sidebar">
      <div id="sidebar-header">
        <h1>ADMIN · GPS TRACKER</h1>
        <div id="admin-email-display"></div>
      </div>
      <div id="user-list-wrap">
        <div id="user-list"></div>
      </div>
      <div id="sidebar-footer">
        <button id="btn-fit" onclick="fitAll()">↔ Centrer sur tous les tracés</button>
        <button id="btn-logout-admin" onclick="adminLogout()">Déconnexion</button>
        <div id="last-refresh"></div>
      </div>
    </div>
    <div id="map"></div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ========== CONFIG — REMPLACE CES VALEURS ==========
  const SUPABASE_URL = 'https://luwdixkakwcnluksexxy.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_yrgVW7g2KTkDnOUa_v9PQQ_w8fXOH3O';
  // ====================================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const USER_COLORS = [
    '#00e5a0','#ff6b6b','#4dabf7','#ffd43b',
    '#cc5de8','#ff922b','#74c0fc','#a9e34b',
    '#f783ac','#20c997'
  ];

  let map, mapReady = false;
  let usersData = {};
  let refreshInterval = null;

  async function adminLogin() {
    const email = document.getElementById('admin-login-email').value.trim();
    const pass = document.getElementById('admin-login-pass').value;
    if (!email || !pass) return setAuthMsg('Remplis tous les champs.', 'error');

    setAuthMsg('Connexion…', '');
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) return setAuthMsg('Email ou mot de passe incorrect.', 'error');

    // Vérifie que c'est bien un admin
    const { data: profile, error: profileError } = await sb
      .from('profiles')
      .select('is_admin')
      .eq('id', data.user.id)
      .single();

    if (profileError || !profile?.is_admin) {
      await sb.auth.signOut();
      return setAuthMsg('Accès refusé : compte non administrateur.', 'error');
    }

    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    document.getElementById('admin-email-display').textContent = email;
    initMap();
    loadAllTracks();
    refreshInterval = setInterval(loadAllTracks, 10000);
  }

  async function adminLogout() {
    clearInterval(refreshInterval);
    await sb.auth.signOut();
    location.reload();
  }

  function initMap() {
    if (mapReady) return;
    mapReady = true;
    map = L.map('map', { center: [48.8566, 2.3522], zoom: 5, attributionControl: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  }

  async function loadAllTracks() {
    // La RLS autorise les admins à lire tous les points
    const { data: points, error } = await sb
      .from('gps_points')
      .select('user_id, lat, lng, recorded_at')
      .order('recorded_at', { ascending: true });

    if (error) { console.error('Erreur chargement points:', error); return; }

    // Récupère les profils pour avoir les emails
    const { data: profiles } = await sb
      .from('profiles')
      .select('id, email');

    const emailMap = {};
    if (profiles) profiles.forEach(p => emailMap[p.id] = p.email);

    // Groupe par utilisateur
    const byUser = {};
    for (const row of (points || [])) {
      if (!byUser[row.user_id]) byUser[row.user_id] = [];
      byUser[row.user_id].push(row);
    }

    let colorIdx = Object.keys(usersData).length;
    for (const [userId, userPoints] of Object.entries(byUser)) {
      const email = emailMap[userId] || userId.slice(0, 8) + '…';
      const isNew = !usersData[userId];
      const color = isNew ? USER_COLORS[colorIdx % USER_COLORS.length] : usersData[userId].color;
      if (isNew) colorIdx++;

      if (usersData[userId]?.layer) map.removeLayer(usersData[userId].layer);

      const latlngs = userPoints.map(p => [p.lat, p.lng]);
      const layer = L.featureGroup();

      if (latlngs.length > 1) {
        L.polyline(latlngs, { color, weight: 3, opacity: 0.85 }).addTo(layer);
      }
      if (latlngs.length > 0) {
        // Marqueur départ
        L.circleMarker(latlngs[0], { radius: 5, color: 'white', fillColor: color, fillOpacity: 1, weight: 2 })
          .bindTooltip(`${email} · départ`).addTo(layer);
        // Marqueur position actuelle
        const last = latlngs[latlngs.length - 1];
        const lastTime = new Date(userPoints[userPoints.length - 1].recorded_at).toLocaleTimeString('fr-FR');
        L.circleMarker(last, { radius: 7, color: 'white', fillColor: color, fillOpacity: 1, weight: 2.5 })
          .bindTooltip(`${email}<br>Dernier point : ${lastTime}`).addTo(layer);
      }

      const visible = usersData[userId]?.visible !== false;
      if (visible) layer.addTo(map);

      usersData[userId] = { email, color, points: userPoints, layer, visible, dist: calcDist(userPoints) };
    }

    renderUserList();
    document.getElementById('last-refresh').textContent =
      'Actualisé à ' + new Date().toLocaleTimeString('fr-FR');
  }

  function renderUserList() {
    const container = document.getElementById('user-list');
    container.innerHTML = '';
    const entries = Object.entries(usersData);
    if (entries.length === 0) {
      container.innerHTML = '<p style="font-size:12px;color:var(--muted);padding:12px;">Aucun tracé enregistré.</p>';
      return;
    }
    for (const [userId, info] of entries) {
      const div = document.createElement('div');
      div.className = 'user-item';
      div.innerHTML = `
        <div class="user-dot" style="background:${info.color};"></div>
        <div class="user-info">
          <div class="user-email">${info.email}</div>
          <div class="user-meta">${info.points.length} pts · ${formatDist(info.dist)}</div>
        </div>
        <div class="user-toggle">${info.visible ? '●' : '○'}</div>
      `;
      div.onclick = () => {
        info.visible = !info.visible;
        if (info.visible) info.layer.addTo(map);
        else map.removeLayer(info.layer);
        div.querySelector('.user-toggle').textContent = info.visible ? '●' : '○';
      };
      container.appendChild(div);
    }
  }

  function fitAll() {
    const layers = Object.values(usersData)
      .filter(u => u.visible && u.points.length > 0)
      .map(u => u.layer);
    if (!layers.length) return;
    map.fitBounds(L.featureGroup(layers).getBounds(), { padding: [40, 40] });
  }

  function calcDist(points) {
    let d = 0;
    for (let i = 1; i < points.length; i++)
      d += haversine(points[i-1].lat, points[i-1].lng, points[i].lat, points[i].lng);
    return d;
  }

  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const φ1 = lat1*Math.PI/180, φ2 = lat2*Math.PI/180;
    const Δφ = (lat2-lat1)*Math.PI/180, Δλ = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function formatDist(m) { return m < 1000 ? Math.round(m)+' m' : (m/1000).toFixed(2)+' km'; }
  function setAuthMsg(txt, type) { const el = document.getElementById('auth-msg'); el.textContent = txt; el.className = type||''; }
</script>
</body>
</html>
