<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPS Tracker — Admin</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #181c27; --surface2: #1f2435;
      --accent: #00e5a0; --danger: #ff4d6d;
      --text: #e8eaf6; --muted: #6b7280; --border: rgba(255,255,255,0.07);
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; overflow: hidden; }
    #app { display: flex; height: 100vh; height: 100dvh; }

    /* SIDEBAR */
    #sidebar {
      width: 300px; flex-shrink: 0; background: var(--surface);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      overflow: hidden;
    }
    #sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
    #sidebar-header h1 { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: 0.06em; }
    #sidebar-header p { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 3px; }

    /* AUTH */
    #admin-auth { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    #admin-auth label { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; }
    #admin-auth input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; color: var(--text);
      font-family: 'JetBrains Mono', monospace; font-size: 12px; outline: none;
    }
    #admin-auth input:focus { border-color: var(--accent); }
    #btn-admin-login {
      background: var(--accent); color: #0f1117; border: none;
      border-radius: 8px; padding: 10px; font-family: 'Syne', sans-serif;
      font-size: 13px; font-weight: 700; cursor: pointer; width: 100%;
    }
    #admin-auth-msg { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--danger); }

    /* USER LIST */
    #user-list-wrap { flex: 1; overflow-y: auto; padding: 8px; display: none; }
    #user-list-wrap::-webkit-scrollbar { width: 4px; }
    #user-list-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .user-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 8px; margin-bottom: 4px;
      cursor: pointer; transition: background 0.15s; border: 1px solid transparent;
    }
    .user-item:hover { background: var(--surface2); }
    .user-item.active { background: var(--surface2); border-color: var(--border); }
    .user-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .user-info { flex: 1; min-width: 0; }
    .user-email { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 2px; }
    .user-toggle { font-size: 14px; color: var(--muted); flex-shrink: 0; }

    #sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); }
    #btn-fit { background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 12px; font-family: 'Syne', sans-serif; font-size: 12px; cursor: pointer; width: 100%; }
    #btn-fit:hover { background: var(--surface2); }
    #last-refresh { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); text-align: center; margin-top: 6px; }

    /* MAP */
    #map { flex: 1; }
    .leaflet-tile { filter: brightness(0.85) saturate(0.6) hue-rotate(200deg); }
    .leaflet-control-attribution { display: none; }
    .leaflet-control-zoom a { background: var(--surface) !important; color: var(--text) !important; border-color: var(--border) !important; }

    /* Tooltip override */
    .leaflet-tooltip {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-family: 'JetBrains Mono', monospace;
      font-size: 11px; border-radius: 6px; padding: 4px 8px;
    }

    /* Mobile fallback */
    @media (max-width: 600px) {
      #sidebar { width: 100%; position: absolute; bottom: 0; left: 0; z-index: 1000; max-height: 40vh; border-right: none; border-top: 1px solid var(--border); }
      #app { flex-direction: column; }
      #map { height: 60vh; }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>ADMIN · GPS TRACKER</h1>
      <p id="admin-status">Non connecté</p>
    </div>

    <div id="admin-auth">
      <label>Service Role Key</label>
      <input type="password" id="service-key" placeholder="eyJhbGci..." />
      <button id="btn-admin-login" onclick="adminLogin()">Accéder à l'admin</button>
      <div id="admin-auth-msg"></div>
      <p style="font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;line-height:1.5;">
        Utilise la <strong style="color:var(--text)">service_role key</strong> de ton projet Supabase.<br>
        Ne partage jamais cette clé.
      </p>
    </div>

    <div id="user-list-wrap">
      <div id="user-list"></div>
    </div>

    <div id="sidebar-footer" style="display:none;" id="footer-wrap">
      <button id="btn-fit" onclick="fitAll()">↔ Centrer sur tous les tracés</button>
      <div id="last-refresh"></div>
    </div>
  </div>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ========== CONFIG — REMPLACE CES VALEURS ==========
  const SUPABASE_URL = 'https://luwdixkakwcnluksexxy.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1d2RpeGtha3djbmx1a3NleHh5Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NzA0ODI1NiwiZXhwIjoyMDkyNjI0MjU2fQ.MLykWHFA8KPDmjBAKH0HRhX_9GORsVPPNzNc9U3g824';
  // =====================================================

  // Couleurs pour les différents utilisateurs
  const USER_COLORS = [
    '#00e5a0', '#ff6b6b', '#4dabf7', '#ffd43b',
    '#cc5de8', '#ff922b', '#74c0fc', '#a9e34b',
    '#f783ac', '#20c997'
  ];

  const map = L.map('map', { center: [48.8566, 2.3522], zoom: 5, attributionControl: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

  let adminSb = null;
  let usersData = {}; // { userId: { email, color, points, layer, visible } }
  let refreshInterval = null;

  async function adminLogin() {
    const serviceKey = document.getElementById('service-key').value.trim();
    if (!serviceKey) return setAdminMsg('Entre la service role key.');

    setAdminMsg('Connexion…');
    try {
      adminSb = supabase.createClient(SUPABASE_URL, serviceKey, {
        auth: { autoRefreshToken: false, persistSession: false }
      });

      // Test de connexion
      const { error } = await adminSb.from('gps_points').select('id').limit(1);
      if (error) throw error;

      document.getElementById('admin-auth').style.display = 'none';
      document.getElementById('user-list-wrap').style.display = 'block';
      document.getElementById('sidebar-footer').style.display = 'block';
      document.getElementById('admin-status').textContent = 'Connecté · admin';
      setAdminMsg('');

      await loadAllUsers();
      refreshInterval = setInterval(loadAllUsers, 10000); // refresh auto toutes les 10s
    } catch(e) {
      setAdminMsg('Erreur : ' + (e.message || 'Clé invalide ?'));
      adminSb = null;
    }
  }

  async function loadAllUsers() {
    if (!adminSb) return;

    // Récupère tous les points groupés
    const { data, error } = await adminSb
      .from('gps_points')
      .select('user_id, lat, lng, recorded_at')
      .order('recorded_at', { ascending: true });

    if (error) return;

    // Grouper par user_id
    const byUser = {};
    for (const row of data) {
      if (!byUser[row.user_id]) byUser[row.user_id] = [];
      byUser[row.user_id].push(row);
    }

    // Récupère les emails via auth admin
    const { data: usersAuth } = await adminSb.auth.admin.listUsers();
    const emailMap = {};
    if (usersAuth?.users) {
      for (const u of usersAuth.users) emailMap[u.id] = u.email;
    }

    let colorIdx = 0;
    for (const [userId, points] of Object.entries(byUser)) {
      const email = emailMap[userId] || userId.slice(0, 8) + '…';
      const isNew = !usersData[userId];
      const color = isNew ? USER_COLORS[colorIdx % USER_COLORS.length] : usersData[userId].color;
      if (isNew) colorIdx++;

      // Met à jour ou crée le layer
      if (usersData[userId]?.layer) {
        map.removeLayer(usersData[userId].layer);
      }

      const latlngs = points.map(p => [p.lat, p.lng]);
      const layer = L.featureGroup();

      // Ligne de tracé
      if (latlngs.length > 1) {
        L.polyline(latlngs, { color, weight: 3, opacity: 0.85 }).addTo(layer);
      }

      // Marqueur de départ
      if (latlngs.length > 0) {
        L.circleMarker(latlngs[0], { radius: 5, color: 'white', fillColor: color, fillOpacity: 1, weight: 2 })
          .bindTooltip(`${email} · départ`, { permanent: false })
          .addTo(layer);
      }

      // Marqueur de position actuelle
      if (latlngs.length > 0) {
        const last = latlngs[latlngs.length - 1];
        const lastTime = new Date(points[points.length - 1].recorded_at).toLocaleTimeString('fr-FR');
        L.circleMarker(last, { radius: 7, color: 'white', fillColor: color, fillOpacity: 1, weight: 2.5 })
          .bindTooltip(`${email}<br>Dernier point : ${lastTime}`, { permanent: false })
          .addTo(layer);
      }

      const visible = usersData[userId]?.visible !== false;
      if (visible) layer.addTo(map);

      const dist = calcTotalDist(points);
      usersData[userId] = { email, color, points, layer, visible, dist };
    }

    renderUserList(emailMap);
    document.getElementById('last-refresh').textContent =
      'Actualisé à ' + new Date().toLocaleTimeString('fr-FR');
  }

  function calcTotalDist(points) {
    let d = 0;
    for (let i = 1; i < points.length; i++) {
      d += haversine(points[i-1].lat, points[i-1].lng, points[i].lat, points[i].lng);
    }
    return d;
  }

  function renderUserList(emailMap) {
    const container = document.getElementById('user-list');
    container.innerHTML = '';

    const entries = Object.entries(usersData);
    if (entries.length === 0) {
      container.innerHTML = '<p style="font-size:12px;color:var(--muted);padding:12px;">Aucun tracé enregistré.</p>';
      return;
    }

    for (const [userId, info] of entries) {
      const div = document.createElement('div');
      div.className = 'user-item';
      div.innerHTML = `
        <div class="user-dot" style="background:${info.color};"></div>
        <div class="user-info">
          <div class="user-email">${info.email}</div>
          <div class="user-meta">${info.points.length} pts · ${formatDist(info.dist)}</div>
        </div>
        <div class="user-toggle">${info.visible ? '●' : '○'}</div>
      `;
      div.onclick = () => toggleUser(userId, div);
      container.appendChild(div);
    }
  }

  function toggleUser(userId, el) {
    const info = usersData[userId];
    info.visible = !info.visible;
    if (info.visible) info.layer.addTo(map);
    else map.removeLayer(info.layer);
    el.querySelector('.user-toggle').textContent = info.visible ? '●' : '○';
  }

  function fitAll() {
    const allLayers = Object.values(usersData)
      .filter(u => u.visible && u.points.length > 0)
      .map(u => u.layer);
    if (allLayers.length === 0) return;
    const group = L.featureGroup(allLayers);
    map.fitBounds(group.getBounds(), { padding: [40, 40] });
  }

  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
    const Δφ = (lat2 - lat1) * Math.PI / 180;
    const Δλ = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function formatDist(m) {
    return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(2) + ' km';
  }

  function setAdminMsg(txt) {
    document.getElementById('admin-auth-msg').textContent = txt;
  }
</script>
</body>
</html>
